<!doctype html>
<html lang="en">
    <head>
        <title>Validation form</title>
        <link rel="stylesheet" href="style.css">
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <div class="form_box">
            <form id="jsForm" name="js_form" onsubmit="return FormValidation()">
                <div class="input-row">
                <input type="text" name="name" placeholder="Name">
                <span class="error">Please Enter Your Name</span>
            </div>

            <div class="input-row">
                <input type="text" name="email" placeholder="Email">
                <span class="error">Please Enter Your email</span>
            </div>

            <div class="input-row">
                <input type="text" name="phone" placeholder="Phone">
                <span class="error">Please Enter Your Phone Number</span>
            </div>

            <div class="input-row">
                <select name="subject">
                    <option value="">Subject*</option>
                    <option value="developer">Web developer</option>
                    <option value="rontend">Frontend Developer</option>
                    <option value="backend">Backend Developer</option>
                </select>
                <span class="error">Please Enter Your Subject</span>
            </div>

            <div class="input-row">
                <textarea name="message" id="" placeholder="Message*"></textarea>
                <span class="error">Please Enter Your Message</span>
            </div>

            <input type="submit" value="Submit" name="">
            </form>
        </div>
        
        <script type="text/javascript" src="Script.js"></script>
        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
